openapi: 3.0.3
info:
  title: Kapso Encuestas
  version: "1.0.0"
  description: >
    Herramienta personalizada de Dify para crear, enviar y leer encuestas de
    WhatsApp en Kapso. Autenticación en Dify: API Key, encabezado X-API-Key.
servers:
  - url: https://api.kapso.ai/platform/v1
paths:
  /workflows:
    get:
      operationId: listarEncuestas
      summary: Lista las encuestas (workflows) del proyecto con su id, nombre y estado.
      parameters:
        - name: status
          in: query
          required: false
          description: draft, active o archived. Vacío = todas.
          schema: { type: string }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        "200": { description: OK }
    post:
      operationId: crearEncuesta
      summary: Crea una encuesta nueva en borrador a partir de un grafo de nodos y aristas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow]
              properties:
                workflow:
                  type: object
                  description: >
                    JSON con name, description, status ("draft") y definition
                    {nodes:[...], edges:[...]}. Sigue la receta del prompt.
      responses:
        "201": { description: Creada }
  /workflows/{workflow_id}:
    patch:
      operationId: actualizarEncuesta
      summary: Cambia una encuesta. Para activarla manda {"status":"active","lock_version":N}.
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow]
              properties:
                workflow:
                  type: object
                  description: >
                    JSON con lock_version (obligatorio, el último que viste) y los
                    campos a cambiar: name, status o definition completa.
      responses:
        "200": { description: OK }
  /workflows/{workflow_id}/definition:
    get:
      operationId: verEncuesta
      summary: Muestra las preguntas (nodos y aristas) y el lock_version de una encuesta.
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /workflows/{workflow_id}/executions:
    get:
      operationId: listarEnvios
      summary: Lista los envíos de una encuesta (uno por persona) con su estado.
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: running, waiting, ended, failed o handoff.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        "200": { description: OK }
    post:
      operationId: enviarEncuesta
      summary: Envía una encuesta ACTIVA a un número de WhatsApp (una persona por llamada).
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_execution]
              properties:
                workflow_execution:
                  type: object
                  description: >
                    JSON {"phone_number":"+57...","phone_number_id":"<número del proyecto>",
                    "variables":{"nombre":"..."}}
      responses:
        "202": { description: Enviada }
  /workflow_executions/{execution_id}:
    get:
      operationId: verRespuestas
      summary: Respuestas de una persona. Están en data.execution_context.vars.
      parameters:
        - name: execution_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
