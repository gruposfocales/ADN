# Hermes solo (sin Dify). Un perfil por repo; el default es el bibliotecario.
# Los valores van en el panel de Dokploy (Environment) o en un .env local, NUNCA en el repo.
services:
  hermes:
    image: nousresearch/hermes-agent:v0.22.7
    command: gateway run
    restart: unless-stopped
    environment:
      - HERMES_HOME=/opt/data
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - hermes-data:/opt/data
    deploy:
      resources:
        limits: { memory: 4G, cpus: "2" }
volumes:
  hermes-data:
